<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tower — The Arkheron Database</title>
    <!--
      GitHub Pages only serves static files, so a hard refresh/deep-link to a
      client-side route (e.g. /Tower/eternals) would otherwise 404. This
      redirects the request back to index.html with the original path encoded
      in the query string; the matching script in index.html restores it
      before React Router mounts. Standard "spa-github-pages" trick.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var segmentCount = 1 // matches the single '/Tower' repo-name segment
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
